# Dependabot: abre pull requests automáticos quando há versão nova das
# dependências, para o projeto não ficar com pacotes desatualizados ou inseguros.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
